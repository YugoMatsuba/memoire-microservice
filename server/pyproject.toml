[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "yugomatsuba", email = "yugo112jp@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic[email]>=2,<3",
    "pyjwt>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.54.0",
]

[project.scripts]
